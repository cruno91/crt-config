# rpi-crt-profiles profile: Sony Trinitron CRT via a Lontium HDMI-to-YPbPr converter.
#
# Shell-compatible KEY=VALUE syntax, but this file is NEVER sourced or executed:
# lib/rpicrt/profile.py parses it, accepts only known keys and validates every
# value. Quotes are required for values with spaces; $, backticks, backslashes
# and quote characters are rejected.

PROFILE_ID=sony-trinitron-lontium
PROFILE_DESCRIPTION="Sony Trinitron consumer CRT, rear component input, NTSC 480i via an active Lontium HDMI-to-YPbPr converter"
PROFILE_STATUS="Working on one physical unit; geometry calibrated by eye; HDMI audio unresolved"

# --- Hardware ---
HARDWARE_TESTED_MODELS="Raspberry Pi 5 Model B"
CONVERTER="Active Lontium HDMI-to-YPbPr converter (EDID name LONTIUM); chipset, revision and ASIN mapping unconfirmed"
CONVERTER_EDID_NAME=LONTIUM
TV_MODEL="Sony Trinitron, exact model not recorded"
TV_INPUT="Rear VIDEO 4 component (YPbPr), 4:3"

# --- Tested software ---
OS_TESTED_ID=debian
OS_TESTED_CODENAMES=trixie
OS_TESTED_ARCH=arm64
KERNEL_TESTED=6.18.50+rpt-rpi-v8

# --- Connector names: DRM HDMI-A-1 == XRandR HDMI-1 == the Pi's HDMI 0 port ---
DRM_CONNECTOR=HDMI-A-1
XRANDR_OUTPUT=HDMI-1

# --- EDID: restricted copy exposing only CTA VIC 6 (720(1440)x480i, 4:3) ---
EDID_FILE=converter-crt.bin
EDID_SHA256=c41a484bac3d25c33d3ec6e84e3fe714adc47b10668d70c9388c90502804cb87
EDID_SOURCE_FILE=lontium-original.bin
EDID_SOURCE_SHA256=e6767693ade654c6aef4a6eba51c27818099e7a54a3d07eefa221bb3782955dd

# Kernel video= mode for the connector (D = force the digital output on).
KERNEL_VIDEO_MODE=720x480@60iD

# --- Custom X11 mode registered by crt-xrandr ---
# Standard 480i is H 720 739 801 858; this mode moves H sync +40 pixels
# (front/sync/back porch 59/62/17). The 17-pixel back porch is NOT standard.
MODE_NAME=720x480i-crt
MODE_CLOCK_KHZ=13500
MODE_H=720,779,841,858
MODE_V=480,488,494,525
MODE_FLAGS=nhsync,nvsync,interlace,dblclk
EXPECTED_DRM_FLAGS=0x101a

# --- Geometry calibration for this particular television (by eye) ---
MARGIN_LEFT=8
MARGIN_RIGHT=48
MARGIN_TOP=16
MARGIN_BOTTOM=16
PHYSICAL_ASPECT=4:3

# --- HDMI audio: disabled is a proposed mitigation, not a verified fix ---
HDMI_AUDIO_DEFAULT=disabled
